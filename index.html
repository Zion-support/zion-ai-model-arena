<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Zion AI Model Arena</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:760px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}table{width:100%;margin-top:1rem;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #30363d;text-align:left;font-size:.9rem}</style></head><body><h1>⚔️ Zion AI Model Arena</h1><p>Compare two LLMs.</p><select id="a"></select> vs <select id="b"></select> <button onclick="go()">Compare</button><div id="out"></div><script>const M={GPT-5:{p:1.25,ctx:400,bench:88},Claude_Sonnet_4_5:{p:3,ctx:200,bench:87},Gemini_2_5_Pro:{p:1.25,ctx:1000,bench:86},Llama_4_Maverick:{p:0.2,ctx:1000,bench:80},Mistral_Large:{p:2,ctx:128,bench:82}};const A=document.getElementById('a'),B=document.getElementById('b');Object.keys(M).forEach(k=>{A.add(new Option(k,k));B.add(new Option(k,k))});B.selectedIndex=1;function go(){const a=M[A.value],b=M[B.value];document.getElementById('out').innerHTML=`<table><tr><th></th><th>${A.value}</th><th>${B.value}</th></tr><tr><td>$/1M input tokens</td><td>$${a.p}</td><td>$${b.p}</td></tr><tr><td>Context (K)</td><td>${a.ctx}</td><td>${b.ctx}</td></tr><tr><td>Composite bench</td><td>${a.bench}</td><td>${b.bench}</td></tr><tr><td>Best value</td><td colspan="2">${(a.bench/a.p>b.bench/b.p)?A.value:B.value}</td></tr></table><p>Full benchmark suite & workload-matched selection: commercial@ziontechgroup.com</p>`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-ai-model-arena">GitHub</a> · <a href="https://ziontechgroup.com/zion-llm-bench/">LLM Bench</a></p></body></html>
